# ---------------------------------------------------------------------------
# Local development overrides. Docker Compose loads this automatically on top
# of docker-compose.yml, so it must never contain anything unsafe by default.
#
# Production does NOT use this file — the VPS runs
# `docker compose -f docker-compose.yml -f docker-compose.prod.yml ...`
# (docker-compose.prod.yml belongs to the VPS deployment work, not to 5B-1).
#
# All host port publishing lives here rather than in the base file, because
# Compose merges `ports` by appending: anything published in the base file
# could not be withdrawn by an override and would reach production with it.
#
# Every port below binds to 127.0.0.1 explicitly, so nothing is reachable from
# the local network.
# ---------------------------------------------------------------------------

services:
  nginx:
    ports:
      # The only entry point in development. Port 8080 rather than 80 so it
      # needs no elevated privileges and cannot collide with an existing
      # listener on port 80.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"

  postgres:
    # ---------------------------------------------------------------------
    # Development-only host access to the database.
    #
    # Needed because the approved development model runs apps/api and apps/cms
    # on the host via `pnpm dev` (ADR-005, approved implementation decision 4),
    # and Prisma migrations run from the host as well. A host process cannot
    # reach an unpublished container port.
    #
    # Publishing a port is NOT sufficient on its own. In docker-compose.yml
    # postgres joins only `data`, which is `internal: true`, and Docker creates
    # no host binding for a container whose networks are all internal: Compose
    # resolves the mapping and HostConfig.PortBindings is populated, but
    # NetworkSettings.Ports stays empty and the host connection is refused.
    # Measured on Docker 29.6.2 / Compose v5.3.1 before this file was changed.
    #
    # `dev-host` exists solely to give the published port a network with a
    # route to the host. It is declared in this file only, so it cannot follow
    # the stack to the VPS, and docker-compose.yml is untouched: `data` stays
    # internal and postgres stays on it.
    #
    # `dev-host` is deliberately NOT `edge`. nginx must not gain a route to the
    # database, so this is a third network that only postgres joins.
    #
    # One accepted trade-off: `data` was internal partly so postgres had no
    # route off the host. On this network it has one, in development only.
    # ---------------------------------------------------------------------
    networks:
      # Both listed explicitly so membership is stated rather than inherited
      # through Compose's merge behaviour.
      - data
      - dev-host
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"

  minio:
    ports:
      # Web console — development only, for confirming buckets and policies by
      # eye. It is deliberately absent from the base file so it can never be
      # published in production.
      - "127.0.0.1:9001:9001"
      # S3 API. Uncomment when host-run applications need object storage;
      # nginx already reaches MinIO over the internal network without it.
      # - "127.0.0.1:9000:9000"

networks:
  # Development only, and declared only in this file — docker-compose.yml has
  # no knowledge of it, so the production topology is unchanged and this
  # network cannot reach the VPS.
  #
  # Not `internal`, because that is the entire point: a published host port
  # requires a network with a route to the host, which is what `data` (kept
  # internal) deliberately does not have.
  #
  # Only postgres joins it. It is not a general-purpose network, and nothing
  # else should be attached to it without revisiting why it exists.
  dev-host:
    driver: bridge
