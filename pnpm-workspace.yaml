packages:
  - "apps/*"
  - "packages/*"
# Build scripts pnpm blocks by default. All three are required:
#   prisma / @prisma/engines — place the schema engine binary `prisma migrate`
#     needs; while blocked, every pnpm-invoked command exits 1.
#   esbuild — tsx depends on it; its postinstall installs the platform binary.
allowBuilds:
  "@prisma/engines": true
  # Denied: argon2's install script is node-gyp-build, which compiles the native addon only when
  # no prebuild matches. Verified rather than assumed — the published package ships prebuilds for
  # darwin-arm64/x64, freebsd-arm64/x64, linux-arm/arm64/x64 and win32-x64, which covers both this
  # workspace's development platform and ADR-005's linux-x64 Docker target, and `argon2.hash` +
  # `argon2.verify` were both exercised against the installed package with the script blocked.
  # Denying it therefore costs nothing and removes the need for a C++ toolchain anywhere.
  argon2: false
  esbuild: true
  prisma: true
  # sharp — Next.js's image optimiser. Its postinstall places the platform's libvips binary.
  # Blocked, it takes the whole workspace down with it: pnpm exits 1 on every command, the
  # same failure mode documented above for prisma. Allowed rather than denied because
  # next/image optimisation has no pure-JS fallback in Next 15 and would fail at build time
  # once real imagery lands, not here in the design proof, which ships no images.
  sharp: true
  # Denied: a transitive native dependency of jest-resolve. Verified that the full
  # apps/api test suite passes without its build script ever running.
  unrs-resolver: false
# Added by pnpm: tsx 4.23.11 is newer than the configured minimum release age.
minimumReleaseAgeExclude:
  - tsx@4.23.11
# Security floors for transitive dependencies (1 November 2026, `pnpm audit --prod`). Each is a
# patch or minor release of the version its parent already uses; majors are left to the parent.
overrides:
  dompurify: ^3.4.17
  proxy-addr: ^2.0.8
  body-parser: ^2.4.0
  multer: ^2.5.0
  qs: ^6.15.4
  fast-uri: ^3.1.6
  js-yaml: ^4.3.2
  source-map-js: ^1.2.2
  fast-copy: ^3.1.0
  brace-expansion: ^5.0.11
  next>postcss: ^8.5.12
  next>sharp: ^0.35.5
  happy-dom: ^20.14.6
