# ---------------------------------------------------------------------------
# Optional overlay: self-hosted mail for the samgp.com domain, using
# docker-mailserver (Postfix + Dovecot + Rspamd + Fail2ban, MIT licensed,
# https://github.com/docker-mailserver/docker-mailserver).
#
# This file is loaded ONLY when explicitly added to the compose command:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.mail.yml up -d
#
# It changes nothing about the existing web/api/cms stack. It is not required
# to deploy the application — mail is an independent capability, and forms
# already degrade gracefully (SmtpMailer skips the notification, never the
# submission) when SMTP_HOST is unset in the api/cms environment.
#
# First verified locally, 15 September 2026, on an isolated test domain (samgp-test.local, not
# this domain) — see git history for that record. Superseded by a real deployment: as of
# 18-20 September 2026 this overlay runs live on the real VPS for samgp.com — DNS cut over,
# real DKIM key published, mailboxes migrated from the previous host (imapsync), and delivery
# verified both ways against a real external mailbox (Gmail). See docs/MAIL_SERVER_SETUP.md for
# the full runbook, the exact DNS records, and how this connects to the application's SMTP_* /
# LEAD_NOTIFICATION_TO variables.
#
# ── Security posture, and why each setting is what it is ────────────────────
# PERMIT_DOCKER=none      Every send must authenticate. The alternative values
#                         (network/connected-networks) are documented upstream
#                         as a way to accidentally create an open relay.
# POSTFIX_INET_PROTOCOLS=ipv4
#                         Avoids an IPv6 relay hole when IPv6 is enabled on
#                         the host but not inside the container network.
# ENABLE_RSPAMD=1 + ENABLE_OPENDKIM=0 + ENABLE_AMAVIS=0
#                         One spam/DKIM/SPF/DMARC engine, not two arguing. Amavis is a SEPARATE
#                         toggle from OpenDKIM and is ON by default even with Rspamd enabled —
#                         found live, 18 September 2026, as the image's own startup warning
#                         ("Running Amavis/SA & Rspamd at the same time is discouraged") and
#                         confirmed as a real cause of delivery failures on this VPS's modest
#                         RAM, not just a discouraged combination.
# ENABLE_FAIL2BAN=1       Brute-force protection on Postfix and Dovecot auth.
#                         Requires NET_ADMIN below (nftables needs it to ban).
# SSL_TYPE=letsencrypt    Reuses the SAME certificate this VPS already issues
#                         for nginx — set up in the SSL/TLS gate, not here.
#                         Do not set this to self-signed for the real domain;
#                         that is a testing-only mode upstream explicitly
#                         warns against for production.
#
# ── What is deliberately NOT decided here ────────────────────────────────────
# ENABLE_CLAMAV is left at 0 (antivirus scanning). Upstream recommends 3-4 GB
# RAM when it is enabled; whether to turn it on is a capacity decision for
# whatever this VPS's actual RAM turns out to be, not a default to inherit
# silently. The 12 real mailboxes this domain wants are ordinary
# `setup email add` accounts — see the runbook for the exact commands; none
# is created here, exactly as no admin credential is seeded anywhere else in
# this repository.
#
# ── Roundcube (webmail) ──────────────────────────────────────────────────
# docker-mailserver is Postfix+Dovecot+Rspamd — it has no browser UI of its
# own. Roundcube is the standard, actively-maintained webmail client
# (roundcube/roundcube, official image) that reads/sends through THIS
# server's own IMAP/submission ports, exactly as a desktop mail client
# (Outlook, Thunderbird) would — it is a client of mailserver, not a second
# mail server. Its own storage is one SQLite file (address book, preferences,
# per-user settings) — never the mail itself, which always lives in
# mailserver's `mail-data` volume above.
#
# Reached through nginx at MAIL_HOSTNAME over HTTPS (the same TLS certificate
# mailserver uses), on the `edge` network nginx already sits on — no port is
# published directly, matching how `web`/`api`/`cms` are reached in production.
# ---------------------------------------------------------------------------

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    # Must match the MX record's target (docs/MAIL_SERVER_SETUP.md) and the
    # certificate's CN/SAN when SSL_TYPE=letsencrypt.
    hostname: ${MAIL_HOSTNAME:?Set MAIL_HOSTNAME, e.g. mail.samgp.com}
    restart: unless-stopped
    env_file: deploy/mail.env
    ports:
      - "25:25" # SMTP (inbound + relay)
      - "587:587" # Submission (STARTTLS) — what apps/api's SmtpMailer uses
      - "993:993" # IMAPS — for staff mail clients
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - mail-config:/tmp/docker-mailserver
      # docker-mailserver's own supported override point — appended to the image's generated
      # main.cf at container start. See the file's own header for why the milter timeouts need
      # widening. Read-only: the image only ever reads this at boot.
      - ./deploy/mailserver/postfix-main.cf:/tmp/docker-mailserver/postfix-main.cf:ro
      # The SAME host path nginx's own TLS termination already mounts
      # (docker-compose.prod.yml's nginx service, `/etc/letsencrypt:/etc/letsencrypt:ro`)
      # — host-installed certbot (apt package), not a per-project directory.
      # Read-only: this service only ever reads the cert.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    cap_add:
      - NET_ADMIN # required for Fail2ban's nftables bans
    networks:
      # `edge` only, deliberately. `data` is `internal: true` in
      # docker-compose.yml — no route off the host — which would silently
      # break both inbound mail from the internet and this server's own
      # outbound relay to every other mail server. mailserver never opens a
      # database connection, so it has no reason to join `data` anyway.
      - edge

  roundcube:
    image: roundcube/roundcubemail:latest
    restart: unless-stopped
    depends_on:
      - mailserver
    environment:
      # `ssl://` = implicit TLS on IMAP's standard 993 (mailserver's own
      # `SSL_TYPE=letsencrypt` cert) — no plaintext IMAP hop, even inside the
      # container network.
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      # `tls://` = STARTTLS on submission (587) — what apps/api's own
      # SmtpMailer already uses against this same server.
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587
      # SQLite: no separate database service or credential for what is only
      # per-user webmail preferences, not the mail data itself.
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    volumes:
      - roundcube-db:/var/roundcube/db
      - roundcube-config:/var/roundcube/config
      # roundcube/roundcubemail's own supported override point — every *.php file under this
      # directory is `include()`d at container start (see the file's own header). Read-only: the
      # image only ever reads it.
      - ./deploy/mailserver/roundcube-tls.php:/var/roundcube/config/zz-tls.php:ro
    networks:
      - edge

volumes:
  mail-data:
  mail-state:
  mail-logs:
  mail-config:
  roundcube-db:
  roundcube-config:
